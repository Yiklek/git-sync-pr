[package]
name = "git-sync-pr"
version = "0.1.0"
edition = "2024"


[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
reqwest = { version = "0.11", features = ["json", "blocking", "multipart"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.24"
regex = "1.12"
url = "2.5"
tokio = { version = "1.48", features = ["full"] }
thiserror = "1.0"
which = "4.4"
dirs = "5.0"
anyhow = "1.0.100"
